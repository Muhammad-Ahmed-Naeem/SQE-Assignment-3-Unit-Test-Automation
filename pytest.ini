[pytest]
# ============================================================================
# Pytest Configuration for SQE Assignment 3
# Author: M. Ahmad Naeem (Roll No: 23F-3113) & Saim Naveed (Roll No: 24F-3043)
# ============================================================================

# Directory where test discovery begins
testpaths = tests

# Default command-line execution options
# -n auto: Run tests in parallel across all available CPU cores (pytest-xdist)
# --strict-markers: Ensure only explicitly registered markers are used
# -ra: Display summary for all non-passing tests
addopts = -ra --strict-markers

# Register custom test markers to divide test cases into distinct suites & groups
markers =
    ahmad_suite: Tests developed by M. Ahmad Naeem (23F-3113)
    saim_suite: Tests developed by Saim Naveed (24F-3043)
    smoke: Smoke / sanity check tests for rapid critical path validation
    regression: Regression test suite covering all modules
    ecp: Tests designed using Equivalence Class Partitioning
    bva: Tests designed using Boundary Value Analysis
    exception: Tests verifying error and exception handling boundaries
    data_driven: Tests consuming external data files (e.g. CSV)
    range_suite: Tests for Module 1 (validators.between & validators.length)
    email_suite: Tests for Module 2 (validators.email)
    domain_suite: Tests for Module 2 (validators.domain)
    network_suite: Tests for Module 3 (validators.ip_address)
    card_suite: Tests for Module 3 (validators.card)
    order: Execution order control managed by pytest-order plugin

# Filter out external deprecation warnings
filterwarnings =
    ignore::DeprecationWarning
