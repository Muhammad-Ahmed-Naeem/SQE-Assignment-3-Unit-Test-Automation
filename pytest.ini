[pytest]
testpaths = tests
addopts = -ra --strict-markers

markers =
    ahmad_suite: Tests written by M. Ahmad Naeem (23F-3113)
    saim_suite: Tests written by Saim Naveed (24F-3043)
    smoke: Quick sanity tests
    regression: Regression test suite
    ecp: Equivalence class partitioning tests
    bva: Boundary value analysis tests
    exception: Error handling tests
    data_driven: External CSV data tests
    range_suite: Range and length tests (Module 1)
    email_suite: Email tests (Module 2)
    domain_suite: Domain tests (Module 2)
    network_suite: IP tests (Module 3)
    card_suite: Card tests (Module 3)
    order: Execution order plugin marker

filterwarnings =
    ignore::DeprecationWarning
